# Throwaway storage spike. Generate the Xcode project with:
#   cd Spike && xcodegen
# Put your team ID in Signing.xcconfig first (see SPIKE.md).

name: TimecardSpike
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TimecardSpike:
    type: application
    platform: macOS
    sources: [HostApp]
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleDisplayName: Timecard Spike
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristenmedo.timecardspike
    dependencies:
      - target: ProbeException
      - target: ProbeGroup
      - target: ProbeNoSandbox

  # Route A: sandboxed, with a temporary exception for ~/.timetrack/
  ProbeException:
    type: app-extension
    platform: macOS
    sources: [Shared, ProbeException]
    info:
      path: ProbeException/Info.plist
      properties:
        CFBundleDisplayName: Probe Exception
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ProbeException/ProbeException.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - /.timetrack/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristenmedo.timecardspike.exception

  # Route B: sandboxed, with an App Group container.
  # If signing fails on this target, delete it here and from the
  # dependencies above, re-run xcodegen, and report the error text.
  ProbeGroup:
    type: app-extension
    platform: macOS
    sources: [Shared, ProbeGroup]
    info:
      path: ProbeGroup/Info.plist
      properties:
        CFBundleDisplayName: Probe Group
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ProbeGroup/ProbeGroup.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)timecard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristenmedo.timecardspike.group

  # Route C: sandbox off
  ProbeNoSandbox:
    type: app-extension
    platform: macOS
    sources: [Shared, ProbeNoSandbox]
    info:
      path: ProbeNoSandbox/Info.plist
      properties:
        CFBundleDisplayName: Probe No Sandbox
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ProbeNoSandbox/ProbeNoSandbox.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kristenmedo.timecardspike.nosandbox
